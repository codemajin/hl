[package]
name = "hl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "cat with syntax highlighting"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "string"] }
globset = { version = "0.4.21", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = true
strip = true
codegen-units = 1
