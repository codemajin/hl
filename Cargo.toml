[package]
name = "hl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "cat with syntax highlighting"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "string"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
globset = { version = "0.4.21", default-features = false }
shell-words = "1.1.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[build-dependencies]
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
strip = true
codegen-units = 1
