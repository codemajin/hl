version: 2
updates:
  # Minor and patch updates come in one PR a week; a major update gets its
  # own PR because it may need code changes.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]

  # The workflows pin each action to a commit SHA with the version in a
  # comment (`@<sha> # vX.Y.Z`); the update changes both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
