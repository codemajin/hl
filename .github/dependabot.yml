version: 2
# Each update waits until the version has been out for 7 days (`cooldown`), so
# that one published by a hijacked account is likely to be yanked before it is
# taken in. Security updates don't wait.
updates:
  # Minor and patch updates come in one PR a week; a major update gets its
  # own PR because it may need code changes.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        update-types: [minor, patch]

  # The workflows pin each action to a commit SHA with the version in a
  # comment (`@<sha> # vX.Y.Z`); the update changes both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
