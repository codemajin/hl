name: CI

on:
  push:
  pull_request:

# Cancel an older run on the same branch or PR when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Warnings fail only the jobs on a fixed Rust version (clippy and doc), so
# that warnings added in a new stable release don't fail the tests by
# themselves.
env:
  CARGO_TERM_COLOR: always

# Actions are pinned to a commit SHA, with the version in a comment, so that a
# moved tag can't change what runs. Dependabot updates both.
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustfmt.toml uses options that only nightly rustfmt applies.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy and doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A fixed version, so that lints added in a new release don't fail CI
      # by themselves. Raise it by hand, together with the coverage job below
      # and the clippy job in release.yml.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo doc --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One test compares `hl` with GNU coreutils `cat` and is skipped
        # without it. ubuntu-24.04 still ships it as `cat` (later releases use
        # uutils), and on macOS it is installed from Homebrew as `gcat`, so
        # that the comparison runs on both. Windows has none, so it is
        # skipped there.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        # "1.88" is the MSRV; keep it in sync with `rust-version` in Cargo.toml.
        rust: [stable, "1.88"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'macOS'
        run: brew install coreutils
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked

  # Fails when the line coverage drops below the threshold, which is a little
  # under the current value. ubuntu-24.04 has the GNU `cat` and `script` that
  # some tests need, so that they are measured too. The Rust version is the
  # one of the clippy job, so that the figure doesn't move with a new release.
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99"
          components: llvm-tools-preview
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo llvm-cov --locked --fail-under-lines 95
