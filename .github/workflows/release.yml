name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fail before the builds if the tag doesn't match Cargo.toml or the
  # changelog has no section for this version.
  check:
    name: check version and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the package version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
      # The section runs up to the next version heading or the link
      # definitions at the end of the file.
      - name: Extract the release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## \[/ || /^\[[^]]*\]: / {
              if (found) exit
              if (index($0, "## [" v "]") == 1) { found = 1; next }
            }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > notes.md || {
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          }
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  # Generated once on Linux: the x86_64-apple-darwin binary is cross-compiled
  # and can't run on its build machine, and the output is the same everywhere.
  assets:
    name: generate completions and man page
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: |
          mkdir completions man
          target/debug/hl --completions bash > completions/hl.bash
          target/debug/hl --completions zsh > completions/_hl
          target/debug/hl --completions fish > completions/hl.fish
          target/debug/hl --man > man/hl.1
      - uses: actions/upload-artifact@v7
        with:
          name: assets
          path: |
            completions
            man

  build:
    name: build (${{ matrix.target }})
    needs: [check, assets]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # musl links statically, so the binaries run on any distribution.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          # macos-latest runs on Apple silicon and cross-compiles for Intel.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: assets
          path: assets
      - name: Package
        run: |
          name="hl-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/hl" LICENSE README.md README_ja.md CHANGELOG.md "$name/"
          cp -R assets/completions assets/man "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: hl-${{ matrix.target }}
          path: hl-*.tar.gz*

  release:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: hl-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: notes
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
        env:
          GH_TOKEN: ${{ github.token }}
